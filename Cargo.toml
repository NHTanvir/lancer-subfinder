[package]
name = "lancer-subfinder"
version = "0.1.0"
edition = "2021"
description = "Rust clone of subfinder — part of the Lancer bug bounty toolkit"
authors = ["NHTanvir <naymulhasantanvir10@gmail.com>"]
license = "MIT"
repository = "https://github.com/NHTanvir/lancer-subfinder"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "signal"] }
async-trait = "0.1"
futures = "0.3"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "gzip", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
once_cell = "1"
governor = "0.6"
dashmap = "5"
indexmap = { version = "2", features = ["serde"] }
rand = "0.8"
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }
sha1 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
incremental = false
debug = false
